name: tdnet-watch

on:
  schedule:
    # UTC = JST-9。UTC 0:00-6:59 の15分おき  = JST  9:00-15:59（場中）
    - cron: "*/15 0-6 * * 1-5"
    # UTC 7:00-8:59 の30分おき              = JST 16:00-17:59（引け後開示）
    - cron: "0,30 7-8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdnet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 浅いクローンだと rebase が失敗することがある

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TZ: Asia/Tokyo
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Save state
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          # 前の実行の push と競合したらリベースして再試行
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "retry $i"; sleep 5
          done
          exit 1
