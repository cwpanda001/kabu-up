name: tdnet-watch

on:
  schedule:
    # 毎時 0/15/30/45 分ちょうどは GitHub Actions の cron が混み合い、
    # 遅延どころか実行自体が丸ごと落とされることがある（公式ドキュメントも
    # 「毎時0分を避けよ」と明記）。分を 3 分ずらして負荷の谷に置く。
    # UTC = JST-9。UTC 0:03-6:48 の15分おき  = JST  9:03-15:48（場中）
    - cron: "3,18,33,48 0-6 * * 1-5"
    # UTC 7時台・8時台の30分おき            = JST 16:03-17:33（引け後開示）
    - cron: "3,33 7-8 * * 1-5"
  workflow_dispatch:
    inputs:
      stock_codes:
        description: "銘柄コードを入力すると現在状況を通知（カンマ区切り可。例: 7203,6758。指定時はこの照会だけ実行）"
        type: string
        default: ""
      test_notify:
        description: "テスト通知だけ送って終了（通知先の設定確認）"
        type: boolean
        default: false
      force:
        description: "休場日でも通常実行する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tdnet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 浅いクローンだと rebase が失敗することがある

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TZ: Asia/Tokyo
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STOCK_CODES: ${{ inputs.stock_codes }}
        run: |
          if [ -n "${STOCK_CODES}" ]; then
            python main.py --stock "${STOCK_CODES}"
          else
            python main.py ${{ inputs.test_notify && '--test-notify' || '' }} ${{ inputs.force && '--force' || '' }}
          fi

      - name: Save state
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          # 前の実行の push と競合したらリベースして再試行
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "retry $i"; sleep 5
          done
          exit 1
