name: tdnet-watch

on:
  schedule:
    # 毎時 0/15/30/45 分ちょうどは GitHub Actions の cron が混み合い、
    # 遅延どころか実行自体が丸ごと落とされることがある（公式ドキュメントも
    # 「毎時0分を避けよ」と明記）。分を 3 分ずらして負荷の谷に置く。
    # UTC = JST-9。UTC 0:03-6:48 の15分おき  = JST  9:03-15:48（場中）
    # この枠ではチャート条件スキャン（--chart-scan）と急落検知（--dip-scan）も一緒に回る
    # （main.py が 16:00 以降は自動で外す）
    - cron: "3,18,33,48 0-6 * * 1-5"
    # UTC 7:03-14:33 の30分おき             = JST 16:03-23:33（引け後開示）
    # 夜間の開示（19時台なども多い）を当夜のうちに通知し、PTS（夜間取引）で
    # 対応する選択肢を残すため、ナイトタイムセッションの間はカバーする
    - cron: "3,33 7-14 * * 1-5"
    # UTC 7:35 = JST 16:35。1日1回の引け後実行。ここだけ教材条件スキャン
    # （--scan-market）と日次サマリ（--summary）を足す。日足が確定していないと
    # 意味が無いので場中には回さない。DAILY_CRON と同じ文字列にしておくこと。
    - cron: "35 7 * * 1-5"
    # UTC 14:48 = JST 23:48。1日の最後（夜間の最終実行 23:33 の後）に1回だけ、
    # その日の通知に出てきた用語の解説（--glossary）を送る。GLOSSARY_CRON と同じ文字列にしておくこと。
    - cron: "48 14 * * 1-5"
    # 注意: GitHub の cron は混雑時に丸ごと落とされ、このリポジトリでは1日5回程度しか届いていない
    # （16:35 の日次は一度も届いたことが無い）。そのため下の Run watcher では cron の種類ではなく
    # 「JST の現在時刻」と「今日もう済ませたか（state/daily.txt・state/glossary.txt）」で
    # 日次処理と用語解説を決める。外部から15分おきに workflow_dispatch しても同じように動く。
  workflow_dispatch:
    inputs:
      stock_codes:
        description: "銘柄コードを入力すると現在状況を通知（カンマ区切り可。例: 7203,6758。指定時はこの照会だけ実行）"
        type: string
        default: ""
      test_notify:
        description: "テスト通知だけ送って終了（通知先の設定確認）"
        type: boolean
        default: false
      force:
        description: "休場日でも通常実行する"
        type: boolean
        default: false
      daily:
        description: "引け後の日次処理（教材条件スキャン＋日次サマリ＋通知銘柄の追跡・成績ページ更新）も実行する"
        type: boolean
        default: false
      glossary:
        description: "用語解説（その日の通知に出た用語）だけ送って終了"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tdnet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 日次実行では日経225を1銘柄ずつではなくまとめて取るが、それでも数分かかる
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 浅いクローンだと rebase が失敗することがある

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TZ: Asia/Tokyo
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 2人目以降の Slack 宛先。Secret 名は自由（人名など）でよく、env 側で
          # SLACK_WEBHOOK_URL_* という名前にすれば notify.py が自動で全部に送る
          SLACK_WEBHOOK_URL_YUKO: ${{ secrets.YUKO }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STOCK_CODES: ${{ inputs.stock_codes }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
          FORCE: ${{ inputs.force }}
          DAILY: ${{ inputs.daily }}
          GLOSSARY: ${{ inputs.glossary }}
          SCHEDULE: ${{ github.event.schedule }}
          DAILY_CRON: "35 7 * * 1-5"
          GLOSSARY_CRON: "48 14 * * 1-5"
          # JST でこの時刻（分単位）以降の最初の実行が、その日の日次処理／用語解説を担当する
          DAILY_AFTER: "16:30"
          GLOSSARY_AFTER: "23:45"
        run: |
          # inputs.* は schedule 実行では空、API 経由の dispatch では "true"/"false" の
          # 文字列で届く。${{ inputs.x && 'a' || 'b' }} は空でない文字列を真と見なすので
          # "false" でも 'a' 側になってしまう。値はそのまま env に渡し、bash で比較する。
          if [ -n "${STOCK_CODES}" ]; then
            python main.py --stock "${STOCK_CODES}"
            exit 0
          fi
          if [ "${TEST_NOTIFY}" = "true" ]; then
            python main.py --test-notify
            exit 0
          fi
          # 手動の用語解説だけ。TDnet の監視は回さない
          if [ "${GLOSSARY}" = "true" ]; then
            python main.py --glossary
            exit 0
          fi
          # 「今日の日次処理／用語解説はもう済んだか」は state/*.txt の日付で判断する
          # （cron が落とされても、15分おきの実行のどれかが代わりに担当する）
          today=$(date +%F)                     # TZ=Asia/Tokyo
          now=$(( 10#$(date +%H) * 60 + 10#$(date +%M) ))
          after() { echo $(( 10#${1%%:*} * 60 + 10#${1##*:} )); }
          daily_done=$(cat state/daily.txt 2>/dev/null || true)
          gloss_done=$(cat state/glossary.txt 2>/dev/null || true)
          # --chart-scan（材料ニュース無しのチャート条件）と --dip-scan（急落検知）は常に付ける。
          # 16:00 以降の実行では main.py 側で回さない
          # （引けの判定は日次実行が --scan-market の日足を使い回して行う）
          opts="--chart-scan --dip-scan"
          if [ "${FORCE}" = "true" ]; then
            opts="${opts} --force"
          fi
          daily=no
          if [ "${DAILY}" = "true" ] || [ "${SCHEDULE}" = "${DAILY_CRON}" ] || \
             { [ "${now}" -ge "$(after "${DAILY_AFTER}")" ] && [ "${daily_done}" != "${today}" ]; }; then
            # --track: 通知した銘柄の「その後」を更新し、成績ページ docs/index.html を作り直す
            opts="${opts} --scan-market --summary --track"
            daily=yes
          fi
          echo "python main.py${opts}"
          python main.py ${opts}
          if [ "${daily}" = "yes" ]; then
            echo "${today}" > state/daily.txt      # 成功したときだけ記録する（失敗したら次の実行が再挑戦）
          fi
          # 1日の最後の用語解説。cron（GLOSSARY_CRON）か、JST 23:45 以降の最初の実行が担当する
          if [ "${SCHEDULE}" = "${GLOSSARY_CRON}" ] || \
             { [ "${now}" -ge "$(after "${GLOSSARY_AFTER}")" ] && [ "${gloss_done}" != "${today}" ]; }; then
            python main.py --glossary
            echo "${today}" > state/glossary.txt
          fi

      - name: Save state
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # names.json = TDnet から覚えた日本語の社名。初回実行までは存在しない
          # track.json / docs = 通知した銘柄の追跡と成績ページ（GitHub Pages で公開）
          for f in state/seen.json state/names.json state/track.json state/daily.txt state/glossary.txt \
                   docs/index.html docs/.nojekyll; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          # 前の実行の push と競合したらリベースして再試行
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "retry $i"; sleep 5
          done
          exit 1
