name: tdnet-watch

on:
  schedule:
    # 毎時 0/15/30/45 分ちょうどは GitHub Actions の cron が混み合い、
    # 遅延どころか実行自体が丸ごと落とされることがある（公式ドキュメントも
    # 「毎時0分を避けよ」と明記）。分を 3 分ずらして負荷の谷に置く。
    # UTC = JST-9。UTC 0:03-6:48 の15分おき  = JST  9:03-15:48（場中）
    # この枠では急落検知（--dip-scan）も一緒に回る（main.py が 16:00 以降は自動で外す）
    - cron: "3,18,33,48 0-6 * * 1-5"
    # UTC 7:03-14:33 の30分おき             = JST 16:03-23:33（引け後開示）
    # 夜間の開示（19時台なども多い）を当夜のうちに通知し、PTS（夜間取引）で
    # 対応する選択肢を残すため、ナイトタイムセッションの間はカバーする
    - cron: "3,33 7-14 * * 1-5"
    # UTC 7:35 = JST 16:35。1日1回の引け後実行。ここだけ教材条件スキャン
    # （--scan-market）と日次サマリ（--summary）を足す。日足が確定していないと
    # 意味が無いので場中には回さない。DAILY_CRON と同じ文字列にしておくこと。
    - cron: "35 7 * * 1-5"
  workflow_dispatch:
    inputs:
      stock_codes:
        description: "銘柄コードを入力すると現在状況を通知（カンマ区切り可。例: 7203,6758。指定時はこの照会だけ実行）"
        type: string
        default: ""
      test_notify:
        description: "テスト通知だけ送って終了（通知先の設定確認）"
        type: boolean
        default: false
      force:
        description: "休場日でも通常実行する"
        type: boolean
        default: false
      daily:
        description: "引け後の日次処理（教材条件スキャン＋日次サマリ）も実行する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tdnet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 日次実行では日経225を1銘柄ずつではなくまとめて取るが、それでも数分かかる
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 浅いクローンだと rebase が失敗することがある

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TZ: Asia/Tokyo
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STOCK_CODES: ${{ inputs.stock_codes }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
          FORCE: ${{ inputs.force }}
          DAILY: ${{ inputs.daily }}
          SCHEDULE: ${{ github.event.schedule }}
          DAILY_CRON: "35 7 * * 1-5"
        run: |
          # inputs.* は schedule 実行では空、API 経由の dispatch では "true"/"false" の
          # 文字列で届く。${{ inputs.x && 'a' || 'b' }} は空でない文字列を真と見なすので
          # "false" でも 'a' 側になってしまう。値はそのまま env に渡し、bash で比較する。
          if [ -n "${STOCK_CODES}" ]; then
            python main.py --stock "${STOCK_CODES}"
            exit 0
          fi
          if [ "${TEST_NOTIFY}" = "true" ]; then
            python main.py --test-notify
            exit 0
          fi
          # --dip-scan は常に付ける。16:00 以降の実行では main.py 側で回さない
          # （引けの判定は日次実行が --scan-market の日足を使い回して行う）
          opts="--dip-scan"
          if [ "${FORCE}" = "true" ]; then
            opts="${opts} --force"
          fi
          if [ "${DAILY}" = "true" ] || [ "${SCHEDULE}" = "${DAILY_CRON}" ]; then
            opts="${opts} --scan-market --summary"
          fi
          echo "python main.py${opts}"
          python main.py ${opts}

      - name: Save state
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          # 前の実行の push と競合したらリベースして再試行
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "retry $i"; sleep 5
          done
          exit 1
